  <text x="534" y="246" text-anchor="middle" class="card-s" fill="#5A6B9E">adopt &#183; doctor &#183; cleanup</text>

  <!-- ===== CYCLE ARROWS (ring rx=340 ry=185) ===== -->
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arr)">
    <path d="M 950 165 A 340 185 0 0 0 1120 190"/>
    <path d="M 1120 190 A 340 185 0 0 0 1244.5 257.5"/>
    <path d="M 1244.5 257.5 A 340 185 0 0 1 950 535"/>
    <path d="M 950 535 A 340 185 0 0 0 655.5 442.5"/>
    <path d="M 655.5 442.5 A 340 185 0 0 0 655.5 257.5"/>
    <path d="M 655.5 257.5 A 340 185 0 0 1 950 165"/>
