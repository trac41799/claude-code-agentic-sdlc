  <text x="950" y="636" text-anchor="middle" class="card-s" fill="#5A6B9E">qa-triage &#183; regression</text>

  <rect x="436.5" y="438" width="195" height="84" rx="12" fill="#EAF0FB" stroke="#1E2761" stroke-width="2"/>
