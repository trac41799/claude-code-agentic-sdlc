      .entry-t  { font: bold 22px Arial, Helvetica, sans-serif; }
      .entry-s  { font: bold 18px Arial, Helvetica, sans-serif; }
      .cmd      { font: bold 16px Arial, Helvetica, sans-serif; }
      .lbl      { font: bold 17px Arial, Helvetica, sans-serif; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
