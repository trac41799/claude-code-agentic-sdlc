  <!-- ===== CYCLE NODES (215x84, ring rx=480 ry=260) ===== -->
  <rect x="852.5" y="48" width="195" height="84" rx="12" fill="#EAF0FB" stroke="#1E2761" stroke-width="2"/>
  <text x="950" y="86" text-anchor="middle" class="card-t" fill="#1E2761">Requirements</text>
  <text x="950" y="116" text-anchor="middle" class="card-s" fill="#5A6B9E">pm-interview &#183; epic</text>

  <rect x="1092.5" y="83" width="195" height="84" rx="12" fill="#EAF0FB" stroke="#1E2761" stroke-width="2"/>
