  <text x="255" y="290" text-anchor="middle" class="cmd" fill="#4A3A00">/asdlc-project</text>

  <ellipse cx="255" cy="500" rx="115" ry="46" fill="#B98A00" stroke="#8A6A00" stroke-width="2.5"/>
