  <text x="250" y="652" text-anchor="middle" class="cmd" fill="#1E2761">/asdlc-doctor &#183; verify setup (any stage)</text>
  <rect x="1220" y="632" width="360" height="30" rx="8" fill="#EAF0FB" stroke="#1E2761" stroke-width="1.5"/>
  <text x="1400" y="652" text-anchor="middle" class="cmd" fill="#1E2761">/asdlc-memory-cleanup &#183; maintain</text>
