<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Request Pipeline</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #6b7280;
      --accent: #2563eb;
      --done: #16a34a;
      --processing: #d97706;
      --queued: #6b7280;
      --failed: #dc2626;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 24px; margin: 0 0 24px; }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }
    input {
      flex: 1 1 200px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .topic { font-weight: 600; }
    .email { color: var(--muted); font-size: 13px; }
    .status {
      margin-left: auto;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
    }
    .status.queued { background: var(--queued); }
    .status.processing { background: var(--processing); }
    .status.done { background: var(--done); }
    .status.failed { background: var(--failed); }
    .result {
      flex-basis: 100%;
      font-size: 13px;
      color: var(--muted);
      word-break: break-word;
    }
    #error { color: var(--failed); font-size: 14px; margin-bottom: 12px; min-height: 20px; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>Research Request Pipeline</h1>
    <form id="form">
      <input id="topic" type="text" placeholder="Research topic" autocomplete="off" required>
      <input id="email" type="email" placeholder="Your email" autocomplete="off" required>
      <button id="submit" type="submit">Submit request</button>
    </form>
    <div id="error"></div>
    <ul id="list"></ul>
  </main>
  <script>
    (function () {
      const form = document.getElementById("form");
      const topicInput = document.getElementById("topic");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("submit");
      const errorBox = document.getElementById("error");
      const list = document.getElementById("list");
      const sources = {};

      function rowFor(req) {
        let row = document.getElementById("req-" + req.id);
        if (!row) {
          row = document.createElement("li");
          row.id = "req-" + req.id;
          row.innerHTML =
            '<span class="topic"></span>' +
            '<span class="email"></span>' +
            '<span class="status"></span>' +
            '<span class="result"></span>';
          list.prepend(row);
        }
        row.querySelector(".topic").textContent = req.topic;
        row.querySelector(".email").textContent = req.email;
        const statusEl = row.querySelector(".status");
        statusEl.textContent = req.status;
        statusEl.className = "status " + (req.status || "");
        const resultEl = row.querySelector(".result");
        resultEl.textContent = req.result || req.error || "";
        return row;
      }

      function openStream(id) {
        if (sources[id]) return;
        const es = new EventSource("/requests/" + id + "/events");
        sources[id] = es;
        es.addEventListener("status", function (event) {
          let data;
          try { data = JSON.parse(event.data); } catch (e) { return; }
          rowFor({ id: id, topic: "", email: "", status: data.status, result: data.result, error: data.error });
          if (data.status === "done" || data.status === "failed") {
            es.close();
            delete sources[id];
          }
        });
        es.onerror = function () {
          es.close();
          delete sources[id];
        };
      }

      async function refresh() {
        try {
          const res = await fetch("/requests");
          const data = await res.json();
          if (!Array.isArray(data) || data.length === 0) {
            list.innerHTML = '<li class="empty">No requests yet.</li>';
            return;
          }
          list.innerHTML = "";
          for (const req of data) {
            rowFor(req);
            if (req.status !== "done" && req.status !== "failed") {
              openStream(req.id);
            }
          }
        } catch (e) { /* transient */ }
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorBox.textContent = "";
        submitBtn.disabled = true;
        try {
          const res = await fetch("/requests", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic: topicInput.value, email: emailInput.value })
          });
          if (!res.ok) {
            let detail = "Submission failed (" + res.status + ")";
            try { detail = (await res.json()).detail || detail; } catch (e) {}
            errorBox.textContent = detail;
            return;
          }
          const req = await res.json();
          rowFor(req);
          openStream(req.id);
          topicInput.value = "";
        } finally {
          submitBtn.disabled = false;
        }
      });

      refresh();
      setInterval(refresh, 5000);
    })();
  </script>
</body>
</html>
